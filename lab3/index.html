<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> Sign Up Page </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <div class="card shadow-lg">
                        <div class="card-body">

                            <h1 class="text-center mb-4">Sign Up Form</h1>
                            <form id="signupForm" action="welcome.html">
                                <label> First Name:
                                    <input type="text" id="fName" name="fName" class="form-control"><br>
                                </label>

                                <label>Last Name:
                                    <input type="text" id="lName" name="lName" class="form-control"><br>
                                </label>

                                Gender:
                                <label><input type="radio" name="gender" value="m"> Male</label>
                                <label><input type="radio" name="gender" value="f"> Female</label><br>

                                <label>Zip Code:
                                    <input type="text" id="zip" name="zip" class="form-control"><br>
                                </label>

                                City: <span id="city"></span><br>
                                Latitude: <span id="latitude"></span><br>
                                Longitude: <span id="longitude"></span><br>

                                <label>State:
                                    <select id="state" name="state" class="form-select">
                                        <option value="">Loading States...</option>
                                    </select><br>
                                </label>

                                <label>Select a County:
                                    <select id="county" name="county" class="form-select"></select><br>
                                </label>

                                <label>Desired Username:
                                    <input type="text" id="username" name="username" class="form-control">
                                </label>
                                <span id="usernameError" class="fw-bold"></span><br><br>

                                <label>Password:
                                    <input type="password" id="password" name="password" class="form-control"><br>
                                </label><br>
                        
                                <span id="suggestedPassword" class="fw-bold"></span><br><br>

                                <label>Type Password Again:
                                    <input type="password" id="passwordAgain" name="passwordAgain" class="form-control"><br>
                                </label>
                                <br>
                                <span id="passwordError" class="fw-bold"></span><br>

                                <button class="btn btn-primary w-100 mt-3">Sign Up</button>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <script src="js/script.js"></script>
        
    </body>
</html>
